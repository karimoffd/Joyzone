 <!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Joyzone registration screen with a premium reusable GSAP slider."
    />
    <title>Joyzone | Ro'yxatdan o'tish</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="root">
      <div class="joy-loader joy-loader-boot" role="status" aria-live="polite">
        <div class="joy-loader-map" aria-hidden="true">
          <span class="loader-line loader-line-1"></span>
          <span class="loader-line loader-line-2"></span>
          <span class="loader-line loader-line-3"></span>
          <span class="loader-line loader-line-4"></span>
          <span class="loader-line loader-line-5"></span>
          <span class="loader-line loader-line-6"></span>
        </div>
        <div class="joy-loader-content">
          <img src="/src/assets/img/Logo.png" alt="Joyzone" class="joy-loader-logo" style="height: 48px; width: auto; filter: brightness(0) invert(1) drop-shadow(0 8px 24px rgba(7, 20, 35, 0.34));" />
          <div class="joy-loader-copy">Joylar tayyorlanmoqda</div>
          <div class="joy-loader-progress"><span></span></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
