# Production-like stack: PostgreSQL, Redis, Django (gunicorn) and nginx with
# the built React app. Copy .env.docker.example to .env.docker and fill it in:
#   docker compose --env-file .env.docker up -d --build
# Put HTTPS (e.g. a host nginx/Caddy or a cloud load balancer) in front of
# the `web` service in production.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-joyzone}
      POSTGRES_USER: ${POSTGRES_USER:-joyzone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-joyzone} -d ${POSTGRES_DB:-joyzone}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build: ./django_backend
    restart: unless-stopped
    env_file: .env.docker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-joyzone}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-joyzone}
      CACHE_URL: redis://redis:6379/1
      DJANGO_ADMIN_URL: django-admin/
      USE_X_FORWARDED_PROTO: "True"
      STATIC_ROOT: /app/staticfiles
      MEDIA_ROOT: /app/media
    volumes:
      - static:/app/staticfiles
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build: .
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - static:/srv/static:ro
      - media:/srv/media:ro
    depends_on:
      - backend

volumes:
  pgdata:
  static:
  media:
